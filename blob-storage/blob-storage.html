<script type="text/x-red" data-template-name="upload-flows">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> 名前</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-connection"><i class="fa fa-font"></i> 接続文字列</label>
        <input type="text" id="node-input-connection">
    </div>
    <div class="form-row">
        <label for="node-input-container" style="white-space: nowrap;"><i class="fa fa-cube"></i> コンテナー名</label>
        <input type="text" id="node-input-container">
    </div>
    <div class="form-row">
        <label for="node-input-overwrite"><i class="fa fa-file"></i> 上書き</label>
        <input type="checkbox" id="node-input-overwrite" style="width:20px" checked="checked">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("upload-flows", {
        category: "Azure Blob",
        color: "#FFFFFF",
        defaults: {
            name: { value: "" },
            connection: { value: "", required: true },
            container: { value: "", required: true },
            overwrite: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: "blob.png",
        label: function () {
            return this.name;
        },
    });
</script>

<script type="text/x-red" data-help-name="upload-flows">
    <p>
        フローを Azure Blob Storage へアップロードします。<br>
        Blobパスは、<code>{ファイル名}</code>です。
    </p>
    
    <h3>入力</h3>
        <dl class="message-properties">
            <dd>指定なし</dd>
        </dl>
    
    <h3>出力</h3>
        <dl class="message-properties">
            <dt>payload<span class="property-type">文字列</span></dt>
            <dd>アップロード結果通知 ※1個でも失敗していたら失敗扱い</dd>
            <dt>inputMessage<span class="property-type">オブジェクト</span></dt>
            <dd>入力メッセージ</dd>
            <dt>succeededPaths<span class="property-type">オブジェクト</span></dt>
            <dd>アップロード成功した入出力ファイルパス</dd>
            <dt>succeededPaths.inputPathList<span class="property-type">配列</span></dt>
            <dd>アップロード成功した入力ファイルパス</dd>
            <dt>succeededPaths.blobPathList<span class="property-type">配列</span></dt>
            <dd>アップロード成功した出力ファイルパス</dd>
        </dl>
    
    <h3>例外</h3>
        <p>
            下記の場合、例外を出力します<br>
            <ul>
                <li>デプロイ時にエラーが発生
                <li>メッセージ受信時、メッセージの構成が不正
                <li>アップロード時、エラーが発生
            </ul>
            出力された例外は、catchノードで取得可能です。<br>
            アップロード時にエラーが発生した場合はノードの出力も同時に行い、catchノードで取得できるメッセージのプロパティも下記が必ず含まれた構成になります。<br>
        </p>
        <dl class="message-properties">
            <dt>payload<span class="property-type">オブジェクト</span></dt>
            <dd>入力メッセージpayload</dd>
            <dt>failedPaths<span class="property-type">オブジェクト</span></dt>
            <dd>アップロード失敗した入出力ファイルパス</dd>
            <dt>failedPaths.inputPathList<span class="property-type">配列</span></dt>
            <dd>アップロード失敗した入力ファイルパス</dd>
            <dt>failedPaths.blobPathList<span class="property-type">配列</span></dt>
            <dd>アップロード失敗したっ出力ファイルパス</dd>
            <dt>error<span class="property-type">オブジェクト</span></dt>
            <dd>アップロード失敗エラー情報</dd>
        </dl>
</script>
